name: Docker Image CI

on:
  push:
    branches: [ "my", "test" ]
  pull_request:
    branches: [ "my", "test" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag efiguard:$(date +%s)
